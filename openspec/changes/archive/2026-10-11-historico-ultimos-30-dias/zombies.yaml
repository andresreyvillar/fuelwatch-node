# Pruebas zombi de historico-ultimos-30-dias: al menos una por escenario del slice.
# Cada zombi es una mutación controlada del código de producción. Con el zombi dentro debe caer
# EXACTAMENTE el test del escenario (o los de expect); al retirarlo la suite vuelve a verde.

- scenario: historico-ultimos-30-dias
  file: frontend_astro/src/lib/fuel.ts
  find: "const HISTORY_WINDOW_DAYS = 30;"
  replace: "const HISTORY_WINDOW_DAYS = 20;"
  expect: [historico-ultimos-30-dias, historico-con-huecos-no-se-rellena]
  why: "si la ventana se acorta a 20 días, el gráfico pierde días del último mes"

- scenario: historico-con-huecos-no-se-rellena
  file: frontend_astro/src/lib/fuel.ts
  find: "(HISTORY_WINDOW_DAYS - 1)"
  replace: "HISTORY_WINDOW_DAYS"
  expect: [historico-ultimos-30-dias, historico-con-huecos-no-se-rellena, historico-sin-datos-recientes]
  why: "si el corte de la ventana se desplaza un día (hoy − 30), entra un día anterior a la ventana"

- scenario: historico-sin-datos-recientes
  file: frontend_astro/src/lib/fuel.ts
  find: "    .gte('fecha', historyWindowStart())\n"
  replace: ""
  expect: [historico-ultimos-30-dias, historico-con-huecos-no-se-rellena, historico-sin-datos-recientes]
  why: "si se quita el filtro de fecha, vuelven los días antiguos y una estación sin datos recientes deja de responder vacío"
