# Lecciones de este proyecto (vsk lesson). La confianza se calcula; no se edita a mano.
- id: setup-commiteado-antes-del-primer-slice
  cuando: Tras instalar, actualizar o reconfigurar VSK y antes de abrir el primer change pack
  regla: La base del setup (vsk/, openspec/ con sus .gitkeep, skills, agentes y hooks) DEBE estar commiteada antes de
    vsk-propose, porque specs-untouched trata lo no trackeado bajo openspec/specs como specs consolidadas modificadas
  nivel: protocolo
  donde: PROJECT.md §Reglas nacidas de lecciones
  estado: codificada
  evidencias:
    - fecha: 2026-10-11
      nota: Gate specs-untouched en rojo en el change estadistica-zona-4-carburantes por openspec/specs/.gitkeep sin trackear;
        resuelto con el commit base 70c6d3b
      change: estadistica-zona-4-carburantes
  promovida: true
- id: falso-supabase-tan-estricto-como-postgrest
  cuando: Al escribir o ampliar un doble de Supabase/PostgREST para tests de endpoints
  regla: El falso de Supabase DEBE rechazar lo que PostgREST rechaza (en .or(), valores con caracteres reservados sin
    comillas) y el texto del usuario en .or() DEBE ir entre comillas con quoteFilterValue(), porque un doble más
    permisivo que el servidor deja en verde consultas que fallan en producción
  nivel: mecanico
  donde: frontend_astro/tests/support/fake-supabase.ts (parseOrValue) + PROJECT.md §Reglas nacidas de lecciones
  estado: codificada
  evidencias:
    - fecha: 2026-10-12
      nota: "busqueda-por-provincia: el verificador adversarial refutó sugerencias-incluyen-provincia con «coruña (a)» → 500
        real (LIKE pattern must not end with escape character) mientras los tests pasaban con el falso"
      change: busqueda-por-provincia
  promovida: true
- id: parseo-igual-en-codigo-y-migracion
  cuando: Al convertir datos externos en el código de sincronización y, a la vez, en una migración SQL
  regla: El código y la migración DEBEN usar la misma regla de validación (misma expresión regular tras normalizar) y los
    tests DEBEN cubrir vacío, solo espacios y formatos no decimales, porque una comprobación hecha antes de normalizar
    (value && ...) deja pasar '  ' como 0 y las dos vías divergen
  nivel: skill
  donde: PROJECT.md §Reglas nacidas de lecciones
  estado: codificada
  evidencias:
    - fecha: 2026-10-12
      nota: "coordenadas-numericas: el verificador adversarial refutó coordenada-sin-dato-es-null con ' ' → 0; el SQL lo
        convertía en NULL"
      change: coordenadas-numericas
- id: contrato-externo-probado-contra-el-servicio-real
  cuando: Al escribir escenarios de error para un servicio externo (rutas, geocodificación, pagos...)
  regla: "Los escenarios de error de un servicio externo DEBEN basarse en respuestas reales del servicio (al menos una
    petición real por caso de error antes de proponer), porque la documentación o la intuición no cubren sus
    particularidades: OSRM no responde NoRoute a un destino sin carretera, lo engancha a la más cercana"
  nivel: skill
  donde: PROJECT.md §Reglas nacidas de lecciones
  estado: codificada
  evidencias:
    - fecha: 2026-10-12
      nota: "ruta-gasolineras: el verificador adversarial refutó ruta-sin-ruta con Madrid → Tenerife (200 con ruta a
        Portugal); el falso de OSRM devolvía NoRoute"
      change: ruta-gasolineras
  promovida: true
- id: escenarios-nuevos-en-slice-entregado
  cuando: Al ampliar con escenarios nuevos un slice ya entregado (shipped) cuyos tests están en verde
  regla: "Los escenarios nuevos sobre un slice entregado DEBEN ir en un slice nuevo (con su propio trigger y tests_root),
    porque el gate red exige que todos los escenarios del slice estén en rojo y los ya entregados están en verde; mejora
    propuesta al kit: que red evalúe solo los escenarios del delta del change pack"
  nivel: protocolo
  donde: PROJECT.md §Reglas nacidas de lecciones
  estado: codificada
  evidencias:
    - fecha: 2026-10-12
      nota: "ruta-orden-y-distancia: el gate red falló al añadir dos escenarios a ruta-gasolineras (7 escenarios en verde); se
        rehízo como slice nuevo"
      change: ruta-orden-y-distancia
  promovida: true
